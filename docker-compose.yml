include:
  - path: ./real-time-ad-gen/docker-compose.yml
    project_directory: ./real-time-ad-gen
    env_file:
      - .env

volumes:
  morpheus_shm:
  ollama_models:

services:
  morpheus:
    build: ./morpheus
    ports:
      - "8080:80"
    env_file: .env
    volumes:
      - morpheus_shm:/dev/shm
    command: >
      /bin/sh -c "mkdir -p /dev/shm/nginx/client_temp
      && chown -R www-data:www-data /dev/shm
      && exec nginx -g 'daemon off;'"

  vast-2-sgai:
    build: ./vast-2-sgai
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development

  dash-player:
    build:
      context: ./dash.js
      dockerfile: ../Dockerfile.dashjs
    ports:
      - "3003:3001"

  sgai-player:
    build:
      context: ./player
      dockerfile: Dockerfile
    ports:
      - "8082:80"

  ollama:
    image: ollama/ollama:0.30.5
    ports:
      - "11434:11434"
    volumes:
      - ${OLLAMA_MODELS_DIR:-ollama_models}:/root/.ollama

  stream-lens:
    build: ./stream-lens
    ports:
      - "8001:8001"
    env_file: .env
    depends_on:
      - ollama

  live-sim:
    build: ./live-sim
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./live-sim/media:/media
    depends_on:
      - morpheus
      - vast-2-sgai
      - stream-lens
      - ad-gen-api

  ad-gen-api:
    env_file:
      - .env
