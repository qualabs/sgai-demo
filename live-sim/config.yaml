# config.yaml — Application configuration (non-secret values)
# Values here are overridden by environment variables of the same name.
# Secrets (API keys) belong in .env, NOT here.

# Server
SERVER_PORT: 8000
PATCH_INTERVAL: 2

# vast-2-sgai
VAST2SGAI_URL: "http://localhost:3000"

# Image generation
IMAGE_MODEL: "gemini-3.1-flash-image-preview"
# IMAGE_MODEL: "gemini-3.1-flash-lite-preview"
IMAGE_ASPECT_RATIO: "16:9"
IMAGE_SIZE: "2K"

