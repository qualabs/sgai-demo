<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>VOD Player</title>

    <script>
        // Resolve service hosts against the host the page was opened from,
        // so the player works whether opened via localhost or a LAN IP (e.g. 192.168.x.x).
        window.SVC_HOST = location.hostname;
        document.write('<scr' + 'ipt src="http://' + SVC_HOST + ':3003/dist/modern/umd/dash.all.debug.js"><\/scr' + 'ipt>');
    </script>

    <!-- Bootstrap core CSS -->
    <link id="bootstrapCss" rel="stylesheet">
    <link id="mainCss" rel="stylesheet">
    <script>
        document.getElementById('bootstrapCss').href = 'http://' + SVC_HOST + ':3003/samples/lib/bootstrap/bootstrap.min.css';
        document.getElementById('mainCss').href = 'http://' + SVC_HOST + ':3003/samples/lib/main.css';
    </script>

    <style>
        .videoContainer {
            position: relative;
            background: #000;
            line-height: 0;
            width: 100%;
        }

        .videoContainer video {
            width: 100%;
            height: auto;
            display: block;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #alternative-video-element {
            display: none;
        }

        details > summary {
            cursor: pointer;
            user-select: none;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 0.4rem 0;
            list-style: none;
        }
        details > summary::-webkit-details-marker { display: none; }
        details > summary::before {
            content: '▶ ';
            font-size: 0.7rem;
        }
        details[open] > summary::before {
            content: '▼ ';
        }

        #context-panel {
            width: 340px;
            flex-shrink: 0;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 0.85rem 1rem;
            font-family: monospace;
            font-size: 0.72rem;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        #context-panel .ctx-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #context-panel .ctx-title {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #94a3b8;
        }

        #context-panel .ctx-clip-info {
            color: #475569;
            font-size: 0.68rem;
            line-height: 1.6;
        }

        #context-panel .ctx-status-box {
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            display: inline-block;
        }
        #context-panel .ctx-status-box.state-waiting    { background:#1e293b; color:#64748b; }
        #context-panel .ctx-status-box.state-processing { background:#422006; color:#fbbf24; }
        #context-panel .ctx-status-box.state-ready      { background:#052e16; color:#4ade80; }
        #context-panel .ctx-status-box.state-error      { background:#450a0a; color:#f87171; }
        #context-panel .ctx-status-box.state-offline    { background:#1e293b; color:#94a3b8; }

        @keyframes ctx-pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.4; }
        }
        #context-panel .ctx-status-box.state-processing {
            animation: ctx-pulse 1.4s ease-in-out infinite;
        }

        #context-panel .ctx-body {
            flex: 1;
            overflow-y: auto;
            max-height: 420px;
            line-height: 1.55;
            color: #e2e8f0;
        }

        #context-panel .ctx-field { margin-bottom: 0.5rem; }
        #context-panel .ctx-label {
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: #64748b;
            margin-bottom: 0.15rem;
        }
        #context-panel .ctx-value { color: #e2e8f0; }

        #context-panel .ctx-mood-tag {
            display: inline-block;
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            background: #1e3a5f;
            color: #93c5fd;
            font-size: 0.7rem;
        }

        #context-panel .ctx-palette {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
        }
        #context-panel .ctx-swatch {
            display: inline-block;
            padding: 0.12rem 0.4rem;
            border-radius: 4px;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            font-size: 0.68rem;
        }

        #context-panel .ctx-cues { list-style: none; padding: 0; margin: 0; }
        #context-panel .ctx-cues li::before { content: '› '; color: #475569; }

        #context-panel .ctx-temporal {
            color: #94a3b8;
            font-style: italic;
            font-size: 0.68rem;
        }

        #context-panel .ctx-fallback { white-space: pre-wrap; }

        #context-panel .ctx-toggle {
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.07em;
            padding: 0.12rem 0.5rem;
            border-radius: 3px;
            border: 1px solid transparent;
            cursor: pointer;
            font-family: monospace;
            line-height: 1.4;
        }
        #context-panel .ctx-toggle-on  { background:#052e16; color:#4ade80; border-color:#166534; }
        #context-panel .ctx-toggle-off { background:#1e293b; color:#64748b; border-color:#334155; }
    </style>
</head>

<body>

    <main>
        <div class="container py-4">
            <header class="pb-3 mb-3 border-bottom d-flex align-items-center gap-3">
                <img id="dashLogo" width="110">
                <h5 class="mb-0">SGAI Demo Player</h5>
            </header>

            <div class="d-flex align-items-center gap-2 mb-2">
                <input type="text" id="manifestUrl" class="form-control form-control-sm" />
                <button id="loadPlayer" class="btn btn-success btn-sm text-nowrap">Load Player</button>
            </div>

            <div class="mb-3 p-2 border rounded" style="background:#f8f9fa; font-size:0.82rem;">
                <div class="d-flex align-items-center justify-content-between mb-1">
                    <span class="text-muted fw-semibold" style="font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em;">Query Params</span>
                    <button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2" onclick="addQueryParam()" style="font-size:0.75rem;">+ Add</button>
                </div>
                <div id="query-params-rows"></div>
                <div class="mt-1 text-muted" id="url-preview" style="font-size:0.72rem; word-break:break-all; font-family:monospace;"></div>
            </div>

            <div class="d-flex gap-3 align-items-start">

                <div class="flex-grow-1 min-w-0">
                    <div class="dash-video-player mb-1">
                        <div class="videoContainer" id="videoContainer">
                            <video id="video-element" controls="true"></video>
                            <video id="alternative-video-element" controls="true"></video>
                            <div id="overlay"></div>
                        </div>
                    </div>

                    <div id="latency-stats" style="display:none; margin-top:0.5rem; font-size:0.8rem; color:#6c757d; font-family:monospace; align-items:center; gap:0.5rem; flex-wrap:wrap;">
                        <span>Live latency: <span id="stat-latency">—</span>s</span>
                        <span style="color:#dee2e6">|</span>
                        <span>Target: <span id="stat-target">—</span>s</span>
                        <span style="color:#dee2e6">|</span>
                        <span>Buffer: <span id="stat-buffer">—</span>s</span>
                        <span style="color:#dee2e6">|</span>
                        <span>Quality:
                            <select id="quality-select" onchange="onQualitySelectChange()"
                                style="font-size:0.75rem; font-family:monospace; border:1px solid #dee2e6; border-radius:3px; padding:0 4px; color:#6c757d; background:#fff;">
                                <option value="auto">Auto (ABR)</option>
                            </select>
                        </span>
                    </div>
                    <div id="ad-break-panel" style="display:none; margin-top:0.5rem; padding:0.6rem 0.8rem; border-radius:8px; font-size:0.8rem; font-family:'SF Mono',Menlo,Consolas,monospace; background:#13131f; border:1px solid #2a2a40; color:#cbd5e1;">
                        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.45rem;">
                            <span id="ad-stepper-title" style="font-weight:700; letter-spacing:0.04em; text-transform:uppercase; font-size:0.7rem; color:#94a3b8;">AD Overlay Lifecycle</span>
                            <span id="ad-stepper-headline" style="font-size:0.74rem; color:#a5b4fc;"></span>
                        </div>
                        <div id="ad-stepper-steps" style="display:flex; flex-direction:column; gap:0.18rem;">
                            <!-- rows injected by JS; ids: step-detected / step-prefetch / step-loaded / step-showing / step-done -->
                        </div>
                    </div>
                </div>

                <div id="context-panel">
                    <div class="ctx-header">
                        <span class="ctx-title">Context Analyzer</span>
                        <button id="ctx-toggle-btn" class="ctx-toggle ctx-toggle-on" onclick="toggleContextProcessing()">ON</button>
                    </div>
                    <div id="ctx-clip-info" class="ctx-clip-info">—</div>
                    <div id="ctx-status-box" class="ctx-status-box">—</div>
                    <div id="ctx-body" class="ctx-body">—</div>
                </div>

            </div>

            <details id="section-network" class="mt-4">
                <summary>Network Requests</summary>
                <div style="margin-top:0.5rem;">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <div class="d-flex align-items-center gap-2">
                            <span id="network-count" class="text-muted" style="font-size:0.75rem;"></span>
                            <select id="network-type-filter" class="form-select form-select-sm py-0"
                                    style="font-size:0.72rem;width:auto;" onchange="_renderNetworkTable()">
                                <option value="">All types</option>
                                <option value="MPD">MPD</option>
                                <option value="MediaSegment">Segment</option>
                                <option value="InitializationSegment">Init</option>
                                <option value="OverlayFetch">Overlay</option>
                            </select>
                        </div>
                        <button class="btn btn-outline-secondary btn-sm py-0 px-2"
                                style="font-size:0.72rem;" onclick="clearNetworkLog()">Clear</button>
                    </div>
                    <div style="max-height:300px; overflow-y:auto; font-size:0.72rem; font-family:monospace;">
                        <table class="table table-sm table-hover mb-0" id="network-table">
                            <thead style="position:sticky;top:0;background:#fff;">
                                <tr>
                                    <th style="width:90px;">Type</th>
                                    <th>URL</th>
                                    <th style="width:55px;">Status</th>
                                    <th style="width:60px;">Size</th>
                                    <th style="width:60px;">ms</th>
                                </tr>
                            </thead>
                            <tbody id="network-tbody"></tbody>
                        </table>
                    </div>
                </div>
            </details>

            <details id="section-manifest" class="mt-4" open>
                <summary>Manifest Viewer <small class="text-muted fw-normal" id="vod-mpd-age"></small></summary>
                <pre id="vod-mpd-viewer" style="
                    background:#f8f9fa;
                    border:1px solid #dee2e6;
                    border-radius:4px;
                    padding:1rem;
                    font-size:0.72rem;
                    max-height:600px;
                    overflow:auto;
                    white-space:pre;
                    word-break:break-all;
                ">Load a player to see the manifest…</pre>
            </details>
        </div><!-- /container -->
    </main>

    <script class="code">
        let player;

        // ── Network panel ──────────────────────────────────────────────────────
        const MAX_NETWORK_ROWS = 100;
        let networkRows = [];

        const TYPE_LABELS = {
            'MPD':                   { label: 'MPD',     cls: 'text-primary' },
            'MediaSegment':          { label: 'Segment', cls: 'text-success' },
            'InitializationSegment': { label: 'Init',    cls: 'text-info'    },
            'OverlayFetch':          { label: 'Overlay', cls: 'text-warning' },
        };

        function _typeInfo(type) {
            return TYPE_LABELS[type] || { label: type || '?', cls: 'text-muted' };
        }

        function _fmtSize(bytes) {
            if (!bytes) return '—';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function _fmtUrl(url) {
            try {
                const u = new URL(url);
                const display = (u.pathname.split('/').pop() || u.pathname) + u.search;
                return `<span title="${url.replace(/"/g, '&quot;')}">${display || url}</span>`;
            } catch (_) { return url; }
        }

        function onMetricAdded(e) {
            if (e.metric !== 'HttpList' || !e.value) return;
            const req = e.value;
            const duration = (req.trequest && req._tfinish)
                ? Math.round(req._tfinish - req.trequest)
                : null;
            const bytes = req.trace
                ? req.trace.reduce((s, t) => s + (t.b ? t.b.reduce((a, b) => a + b, 0) : 0), 0)
                : 0;
            addNetworkRow(req.type, req.url, req.responsecode, bytes, duration);

            // REAL "image loaded" signal: OverlayController triggers an 'OverlayFetch'
            // metric the moment the creative blob finishes downloading (and entry.resolved
            // is set true). See dash.js OverlayController.js:244-255. This means the ad
            // creative is pre-loaded and ready before display. Only the iframe-prefetch
            // path emits it; for non-prefetch overlays this never fires (treated as N/A).
            if (req.type === 'OverlayFetch') {
                const o = window._adOverlay;
                if (o) {
                    console.log('[stepper] OverlayFetch metric → creative loaded', { id: o.id, url: req.url });
                    o.prefetched = true;   // a fetch implies prefetch already kicked in
                    o.loaded = true;
                }
            }
        }

        function addNetworkRow(type, url, responsecode, bytes, durationMs) {
            const { label, cls } = _typeInfo(type);
            const statusCls = responsecode >= 400 ? 'text-danger fw-bold'
                            : responsecode >= 300 ? 'text-warning' : '';
            const row = { type, html: `<tr>
                <td class="${cls}">${label}</td>
                <td>${_fmtUrl(url)}</td>
                <td class="${statusCls}">${responsecode || '—'}</td>
                <td>${_fmtSize(bytes)}</td>
                <td>${durationMs != null ? durationMs : '—'}</td>
            </tr>` };
            networkRows.unshift(row);
            if (networkRows.length > MAX_NETWORK_ROWS) networkRows.pop();
            _renderNetworkTable();
        }

        function _renderNetworkTable() {
            const filter = document.getElementById('network-type-filter')?.value || '';
            const visible = filter ? networkRows.filter(r => r.type === filter) : networkRows;
            document.getElementById('network-tbody').innerHTML = visible.map(r => r.html).join('');
            document.getElementById('network-count').textContent =
                `${visible.length}/${networkRows.length} request${networkRows.length !== 1 ? 's' : ''}`;
        }

        function clearNetworkLog() {
            networkRows = [];
            _renderNetworkTable();
        }

        function addQueryParam() {
            const row = document.createElement('div');
            row.className = 'd-flex align-items-center gap-1 mb-1';
            row.innerHTML = `
                <input type="text" class="form-control form-control-sm qp-key" placeholder="key" style="flex:1;" oninput="buildMpdUrl()" />
                <input type="text" class="form-control form-control-sm qp-val" placeholder="value" style="flex:2;" oninput="buildMpdUrl()" />
                <button type="button" class="btn btn-outline-danger btn-sm py-0 px-1" onclick="this.parentElement.remove(); buildMpdUrl();" style="font-size:0.75rem;">✕</button>`;
            document.getElementById('query-params-rows').appendChild(row);
            buildMpdUrl();
        }

        function buildMpdUrl() {
            const base = document.getElementById('manifestUrl').value.split('?')[0];
            const params = new URLSearchParams();
            document.querySelectorAll('#query-params-rows > div').forEach(row => {
                const k = row.querySelector('.qp-key').value.trim();
                const v = row.querySelector('.qp-val').value;
                if (k) params.append(k, v);
            });
            const qs = params.toString();
            const url = qs ? `${base}?${qs}` : base;
            document.getElementById('url-preview').textContent = qs ? url : '';
            return url;
        }

        function init() {
            document.getElementById('manifestUrl').value = 'http://' + SVC_HOST + ':8080/live.mpd';
            document.getElementById('dashLogo').src = 'http://' + SVC_HOST + ':3003/samples/lib/img/dashjs-logo.png';
            document.getElementById('loadPlayer').addEventListener('click', loadPlayer);
            document.getElementById('manifestUrl').addEventListener('input', buildMpdUrl);
        }

        function loadPlayer() {
            const manifestUrl = buildMpdUrl();
            const video = document.getElementById('video-element');
            const alternativeVideo = document.getElementById('alternative-video-element');
            const overlay = document.getElementById('overlay');

            if (player) {
                player.reset();
            }

            video.setAttribute('controls', 'true');
            video.setAttribute('autoplay', '');
            video.setAttribute('muted', '');

            player = dashjs.MediaPlayer().create();
            window.player = player;

            player.initialize();
            player.attachView(video);
            player.setAlternativeVideoElement(alternativeVideo);
            player.attachOverlayRenderingDiv(overlay);

            player.updateSettings({
                debug: {
                    logLevel: 5
                },
                streaming: {
                    delay: {
                        liveDelay: 10,
                    },
                    liveCatchup: {
                        enabled: true,
                        playbackRate: { min: -0.1, max: 0.1 },
                        maxDrift: 12,
                    },
                    cmcd: {
                        version: 2,
                        enabled: true,
                        cid: 'main-player-cid',
                        sid: 'main-player-sid',
                        targets: [
                            {
                                enabled: true,
                                url: 'main-cmcd-event-mode',
                                enabledKeys: ['e', 'sid', 'cid'],
                                events: ['abs', 'abe', 'as', 'ae']
                            }
                        ]
                    }
                }
            });

            player.attachSource(manifestUrl);

            player.off(dashjs.MediaPlayer.events.METRIC_ADDED, onMetricAdded);
            player.on(dashjs.MediaPlayer.events.METRIC_ADDED, onMetricAdded);

            // Reset and populate quality selector once the stream is ready
            const qualSel = document.getElementById('quality-select');
            if (qualSel) qualSel.innerHTML = '<option value="auto">Auto (ABR)</option>';
            player.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, populateQualitySelector);

            clearNetworkLog();

            // ── Real dash.js overlay-lifecycle events ───────────────────────────
            // Timing for the stepper comes EXCLUSIVELY from the player: the dash.js
            // OverlayEvent payload (presentationTime, duration) gives the media-clock
            // boundaries, and player.time() (the media clock) drives every countdown and
            // transition. There is NO server poll, no latency math, no extrapolation.
            //
            //  • DETECTED: we subscribe to the overlay scheme event
            //    'urn:scte:dash:scte214-events' (Constants.OVERLAY.SCHEME_ID) in
            //    ON_RECEIVE mode. The {mode:'eventModeOnReceive'} option is REQUIRED
            //    (EventBus.js:139): without it dash.js only delivers the ON_START firing,
            //    which happens at display time — too late, and it fails silently. On
            //    receive we read event.presentationTime (ms), event.duration (seconds at
            //    this layer — OverlayController compares presentationTime+duration against
            //    media-clock seconds, see OverlayController.js:313-318) and event.overlay
            //    (mimeType / earliestResolutionTime / uri / mode).
            //
            //  • PREFETCH:  CoreEvents.EVENT_READY_TO_RESOLVE ('eventReadyToResolve') is
            //    fired by EventController when an event reaches its earliestResolutionTime.
            //    It may NOT fire for the overlay path (it's gated on the alt-MPD
            //    earliestResolutionTimeOffset), so we ALSO mark prefetched via the media
            //    clock in the render tick. Whichever happens first wins.
            //
            //  • IMAGE LOADED: OverlayController._prefetchIframeContent() fetches the
            //    creative as a blob and triggers a 'metricAdded' of type 'OverlayFetch'.
            //    That is the REAL "creative pre-loaded" signal (handled in onMetricAdded).
            //    Only the iframe-prefetch path emits it; if !usesPrefetch we treat loaded
            //    as N/A and don't block showing.
            const EVENT_READY_TO_RESOLVE = 'eventReadyToResolve';      // CoreEvents.js:45
            const OVERLAY_SCHEME_ID      = 'urn:scte:dash:scte214-events'; // Constants.js OVERLAY.SCHEME_ID

            // DETECTED — overlay scheme event in ON_RECEIVE mode (fires well before display).
            function _onOverlayReceive(payload) {
                const event = payload && payload.event;
                if (!event || !event.overlay) {
                    console.log('[stepper] scte214-events received but no event.overlay', payload);
                    return;
                }
                // Units note: presentationTime is ms; duration arrives normalized by the
                // EventStream timescale and is consumed as SECONDS at the OverlayController
                // comparison layer. Log it so the conversion can be confirmed at runtime.
                console.log('[stepper] overlay', {
                    pt: event.presentationTime,
                    dur: event.duration,
                    mode: event.overlay.mode,
                    mimeType: event.overlay.mimeType,
                    earliestResolutionTime: event.overlay.earliestResolutionTime,
                    id: event.id,
                });
                // Ignore stop-mode events for creation; use them as a done confirmation.
                if (event.overlay.mode === 'stop') {
                    const o = window._adOverlay;
                    if (o && (event.overlay.refId == o.id || event.id == o.id)) {
                        console.log('[stepper] stop-mode → done confirmation', { id: o.id });
                        o.done = true;
                    }
                    return;
                }
                window._adOverlay = {
                    id: event.id,
                    presentationTime: event.presentationTime / 1000,   // seconds, media clock
                    duration: event.duration,                          // seconds (see units note)
                    lead: (event.overlay.earliestResolutionTime || 5000) / 1000,
                    usesPrefetch: event.overlay.mimeType === 'text/html' && event.overlay.earliestResolutionTime > 0,
                    prefetched: false, loaded: false, showing: false, done: false,
                };
                console.log('[stepper] DETECTED → _adOverlay created', window._adOverlay);
            }

            // PREFETCH — real dash.js early-resolution event (may not fire for overlays).
            function _onEventReadyToResolve(_e) {
                const o = window._adOverlay;
                if (o && !o.prefetched) {
                    console.log('[stepper] eventReadyToResolve → prefetched=true (real event)', { id: o.id });
                    o.prefetched = true;
                }
            }

            player.off(OVERLAY_SCHEME_ID, _onOverlayReceive);
            player.on(OVERLAY_SCHEME_ID, _onOverlayReceive, null, { mode: 'eventModeOnReceive' });
            player.off(EVENT_READY_TO_RESOLVE, _onEventReadyToResolve);
            player.on(EVENT_READY_TO_RESOLVE, _onEventReadyToResolve);

            // Secondary showing/done confirmation only: watch the overlay rendering div for
            // an <iframe>/<img>/<video> insertion (the element appearing means the overlay
            // is on screen). Timing remains driven by the media clock; this is belt-and-
            // suspenders for the showing flag.
            if (window._adOverlayObserver) window._adOverlayObserver.disconnect();
            window._adOverlayObserver = new MutationObserver((mutations) => {
                const o = window._adOverlay;
                if (!o) return;
                for (const m of mutations) {
                    m.addedNodes && m.addedNodes.forEach((node) => {
                        if (!node || !node.tagName) return;
                        const tag = node.tagName.toUpperCase();
                        if (tag === 'IFRAME' || tag === 'IMG' || tag === 'VIDEO') {
                            if (!o.showing) console.log('[stepper] overlay element in DOM → showing (observer)', { id: o.id, tag });
                            o.showing = true;
                        }
                    });
                }
            });
            window._adOverlayObserver.observe(overlay, { childList: true, subtree: true });

            // Latency stats
            document.getElementById('latency-stats').style.display = 'flex';
            if (window._latencyInterval) clearInterval(window._latencyInterval);
            window._latencyInterval = setInterval(() => {
                try {
                    const latency = player.getCurrentLiveLatency();
                    const target  = player.getTargetLiveDelay();
                    const buffer  = player.getBufferLength('video');
                    document.getElementById('stat-latency').textContent = latency != null ? latency.toFixed(1) : '—';
                    document.getElementById('stat-target').textContent  = target  != null ? target.toFixed(1)  : '—';
                    document.getElementById('stat-buffer').textContent  = buffer  != null ? buffer.toFixed(1)  : '—';
                } catch (_) {}
            }, 1000);

            // ── Ad-break lifecycle stepper ──────────────────────────────────────
            // Timing is driven EXCLUSIVELY by the player. The OverlayEvent payload gives
            // the media-clock boundaries (presentationTime `pt`, duration `dur`) and the
            // media clock `player.time()` (`t`) drives every transition and countdown:
            //     displayIn = pt − t            (seconds until the ad shows)
            //     endsIn    = (pt + dur) − t     (seconds until it ends)
            //     showing   = t >= pt
            //     done      = t >= pt + dur
            //     prefetch  = t >= pt − lead     (or the real eventReadyToResolve / OverlayFetch)
            // No server poll, no live-latency, no extrapolation.

            // Step definitions, in lifecycle order. label is the stage name.
            const AD_STEPS = [
                { id: 'detected', label: 'Detected',  desc: 'opportunity known to player' },
                { id: 'prefetch', label: 'Prefetch',  desc: 'early resolution (T−lead)' },
                { id: 'loaded',   label: 'Image loaded', desc: 'creative pre-fetched' },
                { id: 'showing',  label: 'Showing',   desc: 'ad on screen' },
                { id: 'done',     label: 'Done',      desc: 'ad finished' },
            ];

            // Renders the five rows given a map of stepId → {state:'pending'|'active'|'done', note:string}.
            function renderStepper(stepStates, headline) {
                const ICONS = {
                    pending: { ch: '◌', col: '#475569' },
                    active:  { ch: '▶', col: '#a5b4fc' },
                    done:    { ch: '✓', col: '#4ade80' },
                };
                const container = document.getElementById('ad-stepper-steps');
                document.getElementById('ad-stepper-headline').textContent = headline || '';
                container.innerHTML = AD_STEPS.map((step) => {
                    const ss = stepStates[step.id] || { state: 'pending', note: '' };
                    const ic = ICONS[ss.state] || ICONS.pending;
                    const labelCol = ss.state === 'pending' ? '#64748b'
                                   : ss.state === 'active'  ? '#e2e8f0' : '#cbd5e1';
                    const weight = ss.state === 'active' ? '700' : '500';
                    const note = ss.note
                        ? `<span style="margin-left:auto; font-size:0.74rem; color:${ss.state==='active' ? '#fcd34d' : '#64748b'};">${ss.note}</span>`
                        : '';
                    return `<div id="step-${step.id}" style="display:flex; align-items:center; gap:0.5rem; padding:0.12rem 0;">
                        <span style="color:${ic.col}; width:1.1em; text-align:center; font-size:0.95rem;">${ic.ch}</span>
                        <span style="color:${labelCol}; font-weight:${weight};">${step.label}</span>
                        <span style="color:#475569; font-size:0.72rem;">${step.desc}</span>
                        ${note}
                    </div>`;
                }).join('');
            }

            function _fmtCountdown(s) {
                if (s <= 0) return 'now';
                if (s >= 60) return `${Math.floor(s/60)}m ${Math.ceil(s%60)}s`;
                return `${s.toFixed(1)}s`;
            }

            // Single render tick — pure media clock. The OverlayEvent payload (created in
            // _onOverlayReceive) is the only source of pt/dur/lead; player.time() is the
            // only clock. No /api/status, no latency, no extrapolation.
            function renderAdPanel() {
                try {
                    const panel = document.getElementById('ad-break-panel');
                    const o = window._adOverlay;

                    // Media clock: player.time() throws before playback init (MediaPlayer.js:1027).
                    let t = null;
                    try { t = player.time(); } catch (e) { t = null; }

                    if (t == null || !o) {
                        panel.style.display = 'none';
                        return;
                    }

                    const pt   = o.presentationTime;        // seconds, media clock
                    const dur  = o.duration;                // seconds
                    const lead = o.lead;                    // seconds before pt to prefetch

                    const displayIn = pt - t;               // seconds until the ad shows
                    const endsIn    = (pt + dur) - t;        // seconds until it ends

                    // Prefetch via the clock (whichever fires first with the real event).
                    if (!o.prefetched && t >= pt - lead) {
                        console.log('[stepper] prefetched=true (clock)', { id: o.id, t, pt, lead });
                        o.prefetched = true;
                    }

                    // Showing / Done transitions — log on first crossing.
                    if (!o.showing && t >= pt) {
                        console.log('[stepper] SHOWING (clock)', { id: o.id, t, pt });
                        o.showing = true;
                    }
                    if (!o.done && t >= pt + dur) {
                        console.log('[stepper] DONE (clock)', { id: o.id, t, end: pt + dur });
                        o.done = true;
                    }

                    panel.style.display = 'block';

                    // ── Derive each step's state + countdown ────────────────────────
                    const ss = {};
                    const showing = o.showing;
                    const done = o.done;
                    const prefetched = o.prefetched;

                    // 1) Detected — done as soon as the overlay event was received.
                    ss.detected = {
                        state: 'done',
                        note: (showing || done) ? '' : `display in ${_fmtCountdown(displayIn)}`,
                    };

                    // 2) Prefetch — pending until t≥pt−lead, active around the fire, then done.
                    if (showing || done || (o.usesPrefetch && o.loaded)) {
                        ss.prefetch = { state: 'done', note: '' };
                    } else if (prefetched) {
                        ss.prefetch = { state: 'active', note: 'resolving…' };
                    } else {
                        ss.prefetch = { state: 'pending', note: `prefetch in ${_fmtCountdown(displayIn - lead)}` };
                    }

                    // 3) Image loaded — pending until the creative blob is fetched, then done.
                    //    N/A (auto-done) when the overlay doesn't use the prefetch path.
                    if (!o.usesPrefetch) {
                        ss.loaded = { state: 'done', note: 'n/a' };
                    } else if (o.loaded) {
                        ss.loaded = { state: 'done', note: '' };
                    } else if (prefetched) {
                        ss.loaded = { state: 'active', note: 'fetching creative…' };
                    } else {
                        ss.loaded = { state: 'pending', note: '' };
                    }

                    // 4) Showing — active while on screen, with a countdown to end.
                    if (done) {
                        ss.showing = { state: 'done', note: '' };
                    } else if (showing) {
                        ss.showing = { state: 'active', note: `ends in ${_fmtCountdown(endsIn)}` };
                    } else {
                        ss.showing = { state: 'pending', note: `starts in ${_fmtCountdown(displayIn)}` };
                    }

                    // 5) Done — reached once t ≥ pt + dur.
                    ss.done = done ? { state: 'done', note: '' } : { state: 'pending', note: '' };

                    // Panel accent + headline reflect the current phase.
                    let headline;
                    if (done) {
                        panel.style.borderColor = '#4ade80';
                        headline = '✓ Done';
                    } else if (showing) {
                        panel.style.borderColor = '#6366f1';
                        headline = `▶ Showing — ${_fmtCountdown(endsIn)} left`;
                    } else if (prefetched) {
                        panel.style.borderColor = '#f59e0b';
                        headline = `⏳ Preparing — display in ${_fmtCountdown(displayIn)}`;
                    } else {
                        panel.style.borderColor = '#166534';
                        headline = `display in ${_fmtCountdown(displayIn)}`;
                    }

                    renderStepper(ss, headline);

                    // When done, render the final state briefly then reset so the panel
                    // hides and is ready for the next break.
                    if (done && !o._resetScheduled) {
                        o._resetScheduled = true;
                        setTimeout(() => {
                            if (window._adOverlay === o) {
                                window._adOverlay = null;
                                document.getElementById('ad-break-panel').style.display = 'none';
                            }
                        }, 2000);
                    }
                } catch (_) {}
            }
            if (window._adRenderInterval) clearInterval(window._adRenderInterval);
            window._adOverlay = null;
            window._adRenderInterval = setInterval(renderAdPanel, 200);    // media-clock tick
        }

        // ── Quality selector ──────────────────────────────────────────────────

        function populateQualitySelector() {
            if (!player) return;
            const sel = document.getElementById('quality-select');
            if (!sel) return;
            const reps = player.getRepresentationsByType('video');
            if (!reps || !reps.length) return;
            sel.innerHTML = '<option value="auto">Auto (ABR)</option>';
            reps.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r.index;
                opt.textContent = `${r.width}×${r.height} @ ${Math.round(r.bandwidth / 1000)}k`;
                sel.appendChild(opt);
            });
        }

        function onQualitySelectChange() {
            if (!player) return;
            const sel = document.getElementById('quality-select');
            if (!sel) return;
            if (sel.value === 'auto') {
                player.updateSettings({ streaming: { abr: { autoSwitchBitrate: { video: true } } } });
            } else {
                player.updateSettings({ streaming: { abr: { autoSwitchBitrate: { video: false } } } });
                player.setRepresentationForTypeByIndex('video', parseInt(sel.value, 10));
            }
        }

        // ── Context Analyzer panel ─────────────────────────────────────────────

        let _ctxProcessingEnabled = true;

        async function toggleContextProcessing() {
            const newState = !_ctxProcessingEnabled;
            try {
                const r = await fetch('http://' + SVC_HOST + ':8001/processing', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled: newState }),
                });
                if (r.ok) {
                    _ctxProcessingEnabled = newState;
                    _updateCtxToggleBtn();
                }
            } catch (e) {
                console.error('[ctx-toggle] failed:', e);
            }
        }

        function _updateCtxToggleBtn() {
            const btn = document.getElementById('ctx-toggle-btn');
            if (!btn) return;
            btn.textContent = _ctxProcessingEnabled ? 'ON' : 'OFF';
            btn.className = 'ctx-toggle ' + (_ctxProcessingEnabled ? 'ctx-toggle-on' : 'ctx-toggle-off');
        }

        function _fmtIso(iso) {
            if (!iso) return '—';
            return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function _esc(str) {
            return String(str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function _renderKvContext(kvStr) {
            if (!kvStr || typeof kvStr !== 'string')
                return '<span style="color:#475569">—</span>';

            const pairs = kvStr.split('&').filter(p => p.includes('='));
            if (!pairs.length)
                return `<span class="ctx-fallback">${_esc(kvStr)}</span>`;

            const field = (label, html) =>
                `<div class="ctx-field"><div class="ctx-label">${label}</div><div class="ctx-value">${html}</div></div>`;

            return pairs.map(pair => {
                const eqIdx = pair.indexOf('=');
                const key   = pair.slice(0, eqIdx).trim().replace(/^ctx_/, '').replace(/_/g, ' ');
                const val   = decodeURIComponent(pair.slice(eqIdx + 1).replace(/\+/g, ' '));
                return field(key, `<span class="ctx-mood-tag">${_esc(val)}</span>`);
            }).join('');
        }

        function updateContextPanel(ctx) {
            const statusEl = document.getElementById('ctx-status-box');
            const clipEl   = document.getElementById('ctx-clip-info');
            const bodyEl   = document.getElementById('ctx-body');

            const state = ctx.status || 'waiting';
            statusEl.className = 'ctx-status-box state-' + state;
            statusEl.textContent = state;

            const clipParts = [];
            if (ctx.clip_start) clipParts.push('clip: ' + _fmtIso(ctx.clip_start) + ' → ' + _fmtIso(ctx.clip_end));
            if (ctx.processed_at) clipParts.push('analyzed: ' + _fmtIso(ctx.processed_at));
            clipEl.textContent = clipParts.join('  ·  ') || '—';

            bodyEl.innerHTML = ctx.context == null
                ? '<span style="color:#475569">—</span>'
                : _renderKvContext(String(ctx.context));
        }

        function startContextPolling() {
            if (window._ctxPollInterval) clearInterval(window._ctxPollInterval);
            async function poll() {
                try {
                    const r = await fetch('http://' + SVC_HOST + ':8001/context');
                    const j = await r.json();
                    if (!r.ok) {
                        const statusEl = document.getElementById('ctx-status-box');
                        const bodyEl   = document.getElementById('ctx-body');
                        statusEl.className = 'ctx-status-box state-error';
                        statusEl.textContent = 'error ' + r.status;
                        bodyEl.innerHTML = `<span style="color:#f87171">${_esc(j.error || String(r.status))}</span>`;
                        return;
                    }
                    updateContextPanel(j);
                } catch (_) {
                    const statusEl = document.getElementById('ctx-status-box');
                    statusEl.className = 'ctx-status-box state-offline';
                    statusEl.textContent = 'offline';
                }
            }
            poll();
            window._ctxPollInterval = setInterval(poll, 3000);
        }

        document.addEventListener('DOMContentLoaded', init);
        document.addEventListener('DOMContentLoaded', startContextPolling);

        function highlightXml(text) {
            const esc = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');

            return esc
                .replace(/(&lt;\?)([\s\S]*?)(\?&gt;)/g,
                    '<span style="color:#7c3aed">$1$2$3</span>')
                .replace(/(&lt;!--)([\s\S]*?)(--&gt;)/g,
                    '<span style="color:#9ca3af">$1$2$3</span>')
                .replace(/(&lt;\/)([\w:-]+)(&gt;)/g,
                    '<span style="color:#0369a1">$1$2$3</span>')
                .replace(/(&lt;)([\w:-]+)/g,
                    '<span style="color:#0369a1">$1$2</span>')
                .replace(/(&quot;)([^&]*)(&quot;)/g,
                    '<span style="color:#15803d">$1$2$3</span>')
                .replace(/([\w:-]+)(=&quot;)/g,
                    '<span style="color:#b45309">$1</span>$2')
                .replace(/(\/?&gt;)/g,
                    '<span style="color:#0369a1">$1</span>');
        }

        let mpdPollInterval = null;

        function startMpdPolling(url) {
            if (mpdPollInterval) clearInterval(mpdPollInterval);
            async function fetchMpd() {
                try {
                    const r = await fetch(url, { cache: 'no-store', mode: 'cors' });
                    if (r.ok) {
                        document.getElementById('vod-mpd-viewer').innerHTML = highlightXml(await r.text());
                        document.getElementById('vod-mpd-age').textContent = `— updated ${new Date().toLocaleTimeString()}`;
                    }
                } catch (_) {}
            }
            fetchMpd();
            mpdPollInterval = setInterval(fetchMpd, 2000);
        }

        const _origLoadPlayer = loadPlayer;
        loadPlayer = function() {
            _origLoadPlayer();
            const url = document.getElementById('manifestUrl').value.trim();
            if (url) startMpdPolling(url);
        };
    </script>
</body>
