<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>VOD Player</title>

    <script src="http://localhost:3003/dist/modern/umd/dash.all.debug.js"></script>

    <!-- Bootstrap core CSS -->
    <link href="http://localhost:3003/samples/lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="http://localhost:3003/samples/lib/main.css" rel="stylesheet">

    <style>
        .videoContainer {
            position: relative;
            background: #000;
            line-height: 0;
            width: 100%;
        }

        .videoContainer video {
            width: 100%;
            height: auto;
            display: block;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #alternative-video-element {
            display: none;
        }
    </style>
</head>

<body>

    <main>
        <div class="container py-4">
            <header class="pb-3 mb-3 border-bottom d-flex align-items-center gap-3">
                <img src="http://localhost:3003/samples/lib/img/dashjs-logo.png" width="160">
                <h4 class="mb-0">SGAI Demo Player</h4>
            </header>

            <div class="d-flex align-items-center gap-2 mb-3">
                <input type="text" id="manifestUrl" class="form-control form-control-sm" value="http://localhost:8000/live.mpd" />
                <button id="loadPlayer" class="btn btn-success btn-sm text-nowrap">Load Player</button>
            </div>

            <div class="dash-video-player mb-1">
                <div class="videoContainer" id="videoContainer">
                    <video id="video-element" controls="true"></video>
                    <video id="alternative-video-element" controls="true"></video>
                    <div id="overlay"></div>
                </div>
            </div>

            <div id="latency-stats" style="display:none; margin-top:0.5rem; font-size:0.8rem; color:#6c757d; font-family:monospace;">
                Live latency: <span id="stat-latency">—</span>s
                &nbsp;|&nbsp; Target: <span id="stat-target">—</span>s
                &nbsp;|&nbsp; Buffer: <span id="stat-buffer">—</span>s
            </div>
            <div id="ad-break-panel" style="display:none; margin-top:0.5rem; padding:0.5rem 0.75rem; border-radius:6px; font-size:0.82rem; font-family:monospace;">
                <span id="ad-break-text"></span>
            </div>

            <div class="mt-4">
                <h5>Manifest Viewer <small class="text-muted" id="vod-mpd-age"></small></h5>
                <pre id="vod-mpd-viewer" style="
                    background:#f8f9fa;
                    border:1px solid #dee2e6;
                    border-radius:4px;
                    padding:1rem;
                    font-size:0.72rem;
                    max-height:600px;
                    overflow:auto;
                    white-space:pre;
                    word-break:break-all;
                ">Load a player to see the manifest…</pre>
            </div>

            <footer class="pt-3 mt-4 text-muted border-top">
                &copy; DASH-IF
            </footer>
        </div>
    </main>

    <script class="code">
        let player;

        function init() {
            document.getElementById('loadPlayer').addEventListener('click', loadPlayer);
        }

        function loadPlayer() {
            const manifestUrl = document.getElementById('manifestUrl').value;
            const video = document.getElementById('video-element');
            const alternativeVideo = document.getElementById('alternative-video-element');
            const overlay = document.getElementById('overlay');

            if (player) {
                player.reset();
            }

            video.setAttribute('controls', 'true');
            video.setAttribute('autoplay', '');
            video.setAttribute('muted', '');

            player = dashjs.MediaPlayer().create();
            window.player = player;

            player.initialize();
            player.attachView(video);
            player.setAlternativeVideoElement(alternativeVideo);
            player.attachOverlayRenderingDiv(overlay);

            player.updateSettings({
                debug: {
                    // logLevel: 5
                },
                streaming: {
                    delay: {
                        liveDelay: 10,
                    },
                    liveCatchup: {
                        enabled: true,
                        playbackRate: { min: -0.1, max: 0.1 },
                        maxDrift: 12,
                    },
                    cmcd: {
                        version: 2,
                        enabled: true,
                        cid: 'main-player-cid',
                        sid: 'main-player-sid',
                        targets: [
                            {
                                enabled: true,
                                url: 'main-cmcd-event-mode',
                                enabledKeys: ['e', 'sid', 'cid'],
                                events: ['abs', 'abe', 'as', 'ae']
                            }
                        ]
                    }
                }
            });

            player.attachSource(manifestUrl);

            // Latency stats
            document.getElementById('latency-stats').style.display = 'block';
            if (window._latencyInterval) clearInterval(window._latencyInterval);
            window._latencyInterval = setInterval(() => {
                try {
                    const latency = player.getCurrentLiveLatency();
                    const target  = player.getTargetLiveDelay();
                    const buffer  = player.getBufferLength('video');
                    document.getElementById('stat-latency').textContent = latency != null ? latency.toFixed(1) : '—';
                    document.getElementById('stat-target').textContent  = target  != null ? target.toFixed(1)  : '—';
                    document.getElementById('stat-buffer').textContent  = buffer  != null ? buffer.toFixed(1)  : '—';
                } catch (_) {}
            }, 1000);

            // Ad break visualizer — tracks event state locally so the panel stays visible
            // even after the server removes the event (which happens when the ad ends on the
            // server, but the player is still latency seconds behind).
            async function pollAdStatus() {
                try {
                    const r = await fetch('http://localhost:8000/api/status');
                    const j = await r.json();
                    const panel = document.getElementById('ad-break-panel');
                    const text  = document.getElementById('ad-break-text');
                    const latency = (player && typeof player.getCurrentLiveLatency === 'function')
                        ? player.getCurrentLiveLatency() : 0;

                    const apiEvent = (j.events || [])[0] || null;
                    if (apiEvent) {
                        if (!window._adEventState || window._adEventState.id !== apiEvent.id) {
                            window._adEventState = {
                                id: apiEvent.id,
                                durationS: apiEvent.duration_s,
                                lastFireInS: apiEvent.fire_in_s,
                                lastSeenAt: Date.now(),
                            };
                        } else {
                            window._adEventState.lastFireInS = apiEvent.fire_in_s;
                            window._adEventState.lastSeenAt = Date.now();
                        }
                    }

                    const state = window._adEventState;
                    if (!state) {
                        panel.style.display = 'none';
                        return;
                    }

                    // Extrapolate fire_in_s forward from the last known API value
                    const elapsed = (Date.now() - state.lastSeenAt) / 1000;
                    const fireInS = state.lastFireInS - elapsed;
                    const playerFireIn = fireInS + latency;

                    // Once the ad starts playing, stamp the wall-clock time so the
                    // remaining countdown is purely time-based and immune to latency drift.
                    if (playerFireIn <= 0 && !state.adStartedAt) {
                        state.adStartedAt = Date.now();
                    }

                    const remaining = state.adStartedAt
                        ? state.durationS - (Date.now() - state.adStartedAt) / 1000
                        : playerFireIn + state.durationS;

                    if (remaining <= 0) {
                        window._adEventState = null;
                        panel.style.display = 'none';
                        return;
                    }

                    panel.style.display = 'block';

                    if (!state.adStartedAt) {
                        panel.style.background = '#1e3a2f';
                        panel.style.border = '1px solid #166534';
                        panel.style.color = '#86efac';
                        const serverFiresInText = fireInS > 0
                            ? `${fireInS.toFixed(1)}s`
                            : 'Ad triggered by the server';
                        text.innerHTML =
                            `Ad break in ~${playerFireIn.toFixed(1)}s<br>` +
                            `&nbsp;&nbsp;Server fires in: ${serverFiresInText}` +
                            `<br>&nbsp;&nbsp;Player latency:&nbsp; ${latency.toFixed(1)}s`;
                    } else {
                        panel.style.background = '#1c1c2e';
                        panel.style.border = '1px solid #6366f1';
                        panel.style.color = '#a5b4fc';
                        const mins = Math.floor(remaining / 60);
                        const secs = Math.ceil(remaining % 60);
                        text.innerHTML = `Ad break playing — ${mins > 0 ? mins + 'm ' : ''}${secs}s remaining`;
                    }
                } catch (_) {}
            }
            if (window._adPollInterval) clearInterval(window._adPollInterval);
            window._adEventState = null;
            window._adPollInterval = setInterval(pollAdStatus, 1000);
            pollAdStatus();
        }

        document.addEventListener('DOMContentLoaded', init);

        function highlightXml(text) {
            const esc = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');

            return esc
                .replace(/(&lt;\?)([\s\S]*?)(\?&gt;)/g,
                    '<span style="color:#7c3aed">$1$2$3</span>')
                .replace(/(&lt;!--)([\s\S]*?)(--&gt;)/g,
                    '<span style="color:#9ca3af">$1$2$3</span>')
                .replace(/(&lt;\/)([\w:-]+)(&gt;)/g,
                    '<span style="color:#0369a1">$1$2$3</span>')
                .replace(/(&lt;)([\w:-]+)/g,
                    '<span style="color:#0369a1">$1$2</span>')
                .replace(/(&quot;)([^&]*)(&quot;)/g,
                    '<span style="color:#15803d">$1$2$3</span>')
                .replace(/([\w:-]+)(=&quot;)/g,
                    '<span style="color:#b45309">$1</span>$2')
                .replace(/(\/?&gt;)/g,
                    '<span style="color:#0369a1">$1</span>');
        }

        let mpdPollInterval = null;

        function startMpdPolling(url) {
            if (mpdPollInterval) clearInterval(mpdPollInterval);
            async function fetchMpd() {
                try {
                    const r = await fetch(url, { cache: 'no-store', mode: 'cors' });
                    if (r.ok) {
                        document.getElementById('vod-mpd-viewer').innerHTML = highlightXml(await r.text());
                        document.getElementById('vod-mpd-age').textContent = `— updated ${new Date().toLocaleTimeString()}`;
                    }
                } catch (_) {}
            }
            fetchMpd();
            mpdPollInterval = setInterval(fetchMpd, 2000);
        }

        const _origLoadPlayer = loadPlayer;
        loadPlayer = function() {
            _origLoadPlayer();
            const url = document.getElementById('manifestUrl').value.trim();
            if (url) startMpdPolling(url);
        };
    </script>
</body>

</html>
